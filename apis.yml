description: 'Gan & Lee Pharmaceuticals (Shanghai Stock Exchange: 603087) is a Chinese biopharmaceutical
  company founded in 1998, specializing in the research, development, production, and commercialization
  of recombinant insulin analogs and injection devices for diabetes care, alongside a growing oncology
  pipeline and medical devices. Its products, including insulin glargine injections and prefilled pen
  injectors, are marketed across 23 countries with 19 products launched globally and clinical trials
  running in 10 countries. Gan & Lee does not currently publish a public developer API, SDK, or developer
  portal; this API Evangelist profile tracks the company''s public web presence and domain security posture.'
